name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create .env File if Missing
      run: |
        if [ ! -f .env ]; then
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForBuildPurposeOnly12345" > .env
          echo "API_KEY=AIzaSyDummyKeyForBuildPurposeOnly12345" >> .env
        fi

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForBuildPurposeOnly12345' }}
        API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForBuildPurposeOnly12345' }}
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Belajar-Bahasa-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
